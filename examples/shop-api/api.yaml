# The shop API. Wrong on purpose: this file is the example of what the tool reports.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  labels:
    app: shop-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-api
  template:
    metadata:
      labels:
        app: shop-api
    spec:
      hostNetwork: true
      containers:
        - name: api
          image: registry.example/shop/api:latest
          ports:
            - containerPort: 8080
              hostPort: 8080
          env:
            - name: DATABASE_PASSWORD
              value: example-not-a-real-value
            - name: LOG_LEVEL
              value: info
          securityContext:
            privileged: true
            capabilities:
              add: [SYS_ADMIN, NET_BIND_SERVICE]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
        - name: log-shipper
          image: registry.example/shop/log-shipper
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["true"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: shop-api
spec:
  selector:
    app: shop-api
  ports:
    - port: 80
      targetPort: 8080
